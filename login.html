<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSpin - Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
        <header class="navbar">
        <div class="logo-container">
            <span class="logo-icon"><i class="fa-solid fa-table-tennis-paddle-ball"></i></span>
            <div class="logo-text">
                <h1>ProSpin</h1>
                <p>Equipamiento Profesional</p>
            </div>
        </div>

        <div class="header-right">
            <button id="themeToggleBtn" class="btn btn-outline" title="Cambiar tema" style="border-radius: 50%; padding: 8px 12px; margin-left: 10px;"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
        </div>
    </header>

    <main class="main-content" style="max-width: 460px; margin: 56px auto; padding: 0 16px;">
        <section class="products-section" style="padding: 28px;">
            <h2 id="tituloLogin" style="margin-top: 0;">Iniciar sesión</h2>
            <p id="subLogin" style="opacity: .75;">Ingresa para ver el catálogo, tu carrito y tus pedidos.</p>

            <form id="formLogin">
                <div class="form-group" id="grupoNombre" style="display: none;">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input id="email" type="email" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" minlength="8" required autocomplete="current-password">
                </div>
                <button id="btnEnviar" class="btn btn-primary" type="submit" style="width: 100%; margin-top: 12px;">Iniciar sesión</button>
            </form>

            <p style="margin-top: 14px;">
                <button id="btnAlternar" type="button" style="background: none; border: 0; color: var(--accent, #dc2626); font-weight: 600; cursor: pointer; padding: 0;">¿No tienes cuenta? Crear cuenta</button>
            </p>
            <div id="avisoLogin" style="margin-top: 12px; font-size: 14px;"></div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script>
        let modoRegistro = false;
        if (getSesion()) location.replace('index.html');
        if (new URLSearchParams(location.search).get('modo') === 'registro') {
            setTimeout(() => document.getElementById('btnAlternar').click(), 0);
        }

        function mostrar(texto, tipo) {
            const a = document.getElementById('avisoLogin');
            a.textContent = texto;
            a.style.color = tipo === 'error' ? '#b91c1c' : '#166534';
        }

        document.getElementById('btnAlternar').onclick = () => {
            modoRegistro = !modoRegistro;
            document.getElementById('grupoNombre').style.display = modoRegistro ? 'block' : 'none';
            document.getElementById('nombre').required = modoRegistro;
            document.getElementById('tituloLogin').textContent = modoRegistro ? 'Crear cuenta' : 'Iniciar sesión';
            document.getElementById('btnEnviar').textContent = modoRegistro ? 'Crear cuenta' : 'Iniciar sesión';
            document.getElementById('btnAlternar').textContent = modoRegistro ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Crear cuenta';
        };

        document.getElementById('formLogin').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const nombre = document.getElementById('nombre').value.trim();
            const boton = document.getElementById('btnEnviar');
            boton.disabled = true;
            try {
                if (modoRegistro) {
                    const r = await fetch(API_BASE + '/auth/registro', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre: nombre, email: email, password: password })
                    });
                    if (r.status === 409) throw new Error('Ese correo ya está registrado.');
                    if (!r.ok) throw new Error('No se pudo crear la cuenta. Revisa los datos.');
                    sessionStorage.setItem('prospin_nombre', nombre);
                }
                const r = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                if (!r.ok) throw new Error('Correo o contraseña incorrectos.');
                guardarSesion(await r.json(), email);
                location.replace('index.html');
            } catch (err) {
                mostrar(err.message, 'error');
            } finally {
                boton.disabled = false;
            }
        };
    </script>
</body>
</html>
