<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProSpin | Iniciar sesión</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,"Segoe UI",Arial,sans-serif}
.caja{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.3);box-sizing:border-box;margin:16px}
h1{margin:0 0 4px;font-size:26px;color:#0f172a}
.sub{color:#64748b;margin:0 0 20px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px;color:#0f172a}
input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;box-sizing:border-box}
button.principal{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#dc2626;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button.principal:disabled{background:#94a3b8;cursor:not-allowed}
button.alternar{background:none;border:0;color:#dc2626;margin-top:12px;font-weight:600;cursor:pointer;padding:0}
.aviso{margin-top:14px;padding:10px 12px;border-radius:8px;display:none;font-size:14px}
.aviso.error{display:block;background:#fee2e2;color:#991b1b}
.aviso.ok{display:block;background:#dcfce7;color:#166534}
.demo{margin-top:22px;font-size:13px;color:#475569;background:#f1f5f9;padding:12px;border-radius:8px;line-height:1.6}
.oculto{display:none}
</style>
</head>
<body>
<div class="caja">
  <h1>ProSpin</h1>
  <p class="sub" id="subtitulo">Inicia sesión para ver la tienda</p>

  <form id="formulario">
    <div id="campoNombre" class="oculto">
      <label for="nombre">Nombre</label>
      <input id="nombre" autocomplete="name">
    </div>
    <label for="email">Correo</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" required minlength="8" autocomplete="current-password">
    <button id="enviar" class="principal" type="submit">Iniciar sesión</button>
  </form>

  <button id="alternar" class="alternar" type="button">¿No tienes cuenta? Crear cuenta</button>
  <div id="aviso" class="aviso"></div>
</div>

<script src="auth.js"></script>
<script>
let modoRegistro = false;
const params = new URLSearchParams(location.search);

if (getSesion()) location.replace('tienda.html');

function mostrar(texto, tipo) {
  const a = document.getElementById('aviso');
  a.textContent = texto;
  a.className = 'aviso ' + tipo;
}

if (params.get('motivo') === 'expirada') mostrar('Tu sesión expiró. Vuelve a iniciar sesión.', 'error');

document.getElementById('alternar').onclick = () => {
  modoRegistro = !modoRegistro;
  document.getElementById('campoNombre').classList.toggle('oculto', !modoRegistro);
  document.getElementById('nombre').required = modoRegistro;
  document.getElementById('subtitulo').textContent = modoRegistro
    ? 'Crea tu cuenta de cliente'
    : 'Inicia sesión para ver la tienda';
  document.getElementById('enviar').textContent = modoRegistro ? 'Crear cuenta' : 'Iniciar sesión';
  document.getElementById('alternar').textContent = modoRegistro
    ? '¿Ya tienes cuenta? Inicia sesión'
    : '¿No tienes cuenta? Crear cuenta';
};

document.getElementById('formulario').onsubmit = async (e) => {
  e.preventDefault();
  const boton = document.getElementById('enviar');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  boton.disabled = true;
  try {
    if (modoRegistro) {
      const nombre = document.getElementById('nombre').value.trim();
      const r = await fetch(API_BASE + '/auth/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, email, password })
      });
      if (r.status === 409) throw new Error('Ese correo ya está registrado.');
      if (!r.ok) throw new Error('No se pudo crear la cuenta. Revisa los datos.');
    }
    const r = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!r.ok) throw new Error('Correo o contraseña incorrectos.');
    guardarSesion(await r.json(), email);
    location.replace('tienda.html');
  } catch (err) {
    mostrar(err.message, 'error');
  } finally {
    boton.disabled = false;
  }
};
</script>
</body>
</html>
