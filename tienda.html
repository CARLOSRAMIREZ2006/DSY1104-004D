<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProSpin | Tienda</title>
<style>
:root{--bg:#f1f5f9;--panel:#0f172a;--side:#1e293b;--rojo:#dc2626;--texto:#0f172a;--muted:#64748b;--borde:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--texto)}
header{background:var(--panel);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;flex-wrap:wrap;gap:10px}
.marca{font-size:22px;font-weight:700}
.marca small{display:block;font-size:12px;color:#94a3b8;font-weight:400}
.acciones{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.usuario{font-size:13px;color:#cbd5e1}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-rojo:disabled{background:#94a3b8;cursor:not-allowed}
.btn-gris{background:#334155;color:#fff}
.btn-linea{background:#fff;border:1px solid var(--borde);color:var(--texto)}
.layout{display:flex;min-height:calc(100vh - 70px)}
aside{width:240px;background:var(--side);color:#e2e8f0;padding:20px 12px;flex-shrink:0}
aside h3{font-size:12px;text-transform:uppercase;color:#94a3b8;margin:18px 10px 8px;letter-spacing:.5px}
aside a{display:block;color:#e2e8f0;text-decoration:none;padding:9px 12px;border-radius:8px;margin-bottom:4px;cursor:pointer;font-size:15px}
aside a:hover,aside a.activo{background:#334155}
main{flex:1;padding:24px;min-width:0}
h2{margin:0 0 16px}
.buscador{width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:10px;font-size:15px;margin-bottom:16px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--borde);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:200px;object-fit:contain;background:#fff;padding:10px;box-sizing:border-box}
.card .info{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.cat{font-size:12px;color:var(--muted);text-transform:uppercase}
.nombre{font-weight:600;font-size:15px;min-height:40px}
.precio{font-size:20px;font-weight:700}
.stock{font-size:13px;color:var(--muted)}
.sin-stock{color:#b91c1c;font-weight:600}
.pie{padding:0 14px 14px}
.pie button{width:100%}
.vista{display:none}
.vista.activa{display:block}
.oculto{display:none !important}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--borde);text-align:left;font-size:14px;vertical-align:top}
th{background:#f8fafc}
.aviso{padding:12px 14px;border-radius:10px;margin-bottom:14px;display:none}
.aviso.ok{display:block;background:#dcfce7;color:#166534}
.aviso.error{display:block;background:#fee2e2;color:#991b1b}
.carrito{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;max-width:460px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--borde);font-size:14px}
.detalle{background:#fff;border-radius:12px;padding:16px;margin-top:16px}
.detalle table{margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="marca">ProSpin<small>Equipamiento Profesional</small></div>
  <div class="acciones">
    <span class="usuario" id="usuario"></span>
    <button class="btn-gris" data-roles="CLIENTE,ADMIN" onclick="irA('carrito')">Carrito (<span id="cantCarrito">0</span>)</button>
    <button class="btn-linea" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>

<div class="layout">
  <aside>
    <h3>Menú</h3>
    <a data-vista="catalogo" class="activo" onclick="irA('catalogo')">Catálogo</a>
    <a data-vista="carrito" data-roles="CLIENTE,ADMIN" onclick="irA('carrito')">Carrito</a>
    <a data-vista="compras" data-roles="CLIENTE" onclick="irA('compras')">Mis compras</a>
    <a data-vista="ordenes" data-roles="ADMIN,VENDEDOR" onclick="irA('ordenes')">Órdenes</a>
    <h3>Categorías</h3>
    <div id="categorias"></div>
  </aside>

  <main>
    <section id="vista-catalogo" class="vista activa">
      <h2>Catálogo de productos</h2>
      <div id="avisoCatalogo" class="aviso"></div>
      <input id="buscar" class="buscador" placeholder="Busca un madero, goma, marca..." oninput="filtrar()">
      <div id="grid" class="grid"></div>
    </section>

    <section id="vista-carrito" class="vista" data-roles="CLIENTE,ADMIN">
      <h2>Carrito</h2>
      <div id="avisoCarrito" class="aviso"></div>
      <div class="carrito">
        <div id="listaCarrito"></div>
        <p><strong id="totalCarrito"></strong></p>
        <button class="btn-rojo" onclick="confirmarCompra()">Confirmar compra</button>
      </div>
    </section>

    <section id="vista-compras" class="vista" data-roles="CLIENTE">
      <h2>Mis compras</h2>
      <div id="avisoCompras" class="aviso"></div>
      <table>
        <thead><tr><th>N°</th><th>Fecha</th><th>Productos</th><th>Total</th></tr></thead>
        <tbody id="tablaCompras"></tbody>
      </table>
    </section>

    <section id="vista-ordenes" class="vista" data-roles="ADMIN,VENDEDOR">
      <h2>Órdenes</h2>
      <div id="avisoOrdenes" class="aviso"></div>
      <table>
        <thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Total</th></tr></thead>
        <tbody id="tablaOrdenes"></tbody>
      </table>
      <div id="detalleOrden" class="detalle"></div>
    </section>
  </main>
</div>

<script src="auth.js"></script>
<script>
const sesion = requireSesion();
let productos = [];
let categoriaActiva = null;
let carrito = JSON.parse(sessionStorage.getItem('prospin_carrito') || '[]');

const clp = n => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(n);
const fecha = f => new Date(f).toLocaleString('es-CL');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const puede = (...roles) => !!sesion && roles.includes(sesion.rol);

function mostrarAviso(id, texto, tipo) {
  const el = document.getElementById(id);
  el.textContent = texto;
  el.className = 'aviso ' + tipo;
  setTimeout(() => { el.className = 'aviso'; }, 5000);
}

// Oculta lo que el rol no puede ver (la seguridad real la aplica el backend)
function aplicarRoles(rol) {
  document.querySelectorAll('[data-roles]').forEach(el => {
    el.classList.toggle('oculto', !el.dataset.roles.split(',').includes(rol));
  });
}

function irA(vista) {
  document.querySelectorAll('.vista').forEach(v =>
    v.classList.toggle('activa', v.id === 'vista-' + vista && !v.classList.contains('oculto')));
  document.querySelectorAll('aside a[data-vista]').forEach(a =>
    a.classList.toggle('activo', a.dataset.vista === vista));
  if (vista === 'compras') cargarCompras();
  if (vista === 'ordenes') cargarOrdenes();
  if (vista === 'carrito') renderCarrito();
}

function init() {
  document.getElementById('usuario').textContent = sesion.email + ' · ' + sesion.rol;
  aplicarRoles(sesion.rol);
  cargarProductos();
  renderCarrito();
}

// ---------- Catálogo ----------
async function cargarProductos() {
  try {
    productos = await apiFetch('/productos');
    renderCategorias();
    filtrar();
    renderCarrito();
  } catch (e) {
    mostrarAviso('avisoCatalogo', e.message, 'error');
  }
}

function renderCategorias() {
  const nombres = [...new Set(productos.map(p => p.categoria))].sort();
  document.getElementById('categorias').innerHTML =
    '<a onclick="filtrarCategoria(null)">Todas</a>' +
    nombres.map(n => `<a data-cat="${esc(n)}" onclick="filtrarCategoria(this.dataset.cat)">${esc(n)}</a>`).join('');
}

function filtrarCategoria(cat) {
  categoriaActiva = cat;
  filtrar();
  irA('catalogo');
}

function filtrar() {
  const q = document.getElementById('buscar').value.toLowerCase().trim();
  const lista = productos.filter(p =>
    (!categoriaActiva || p.categoria === categoriaActiva) &&
    (p.nombre.toLowerCase().includes(q) ||
     p.codigo.toLowerCase().includes(q) ||
     (p.descripcion || '').toLowerCase().includes(q)));
  renderProductos(lista);
}

function renderProductos(lista) {
  const grid = document.getElementById('grid');
  if (!lista.length) {
    grid.innerHTML = '<p>No hay productos para este filtro.</p>';
    return;
  }
  const puedeComprar = puede('CLIENTE', 'ADMIN');
  grid.innerHTML = lista.map(p => {
    const agotado = p.stock <= 0;
    const boton = puedeComprar
      ? `<div class="pie"><button class="btn-rojo" ${agotado ? 'disabled' : ''} onclick="agregar(${p.id})">${agotado ? 'Sin stock' : 'Añadir al carrito'}</button></div>`
      : '';
    return `<div class="card">
      <img src="${esc(p.imagen)}" alt="${esc(p.nombre)}">
      <div class="info">
        <span class="cat">${esc(p.categoria)}</span>
        <span class="nombre">${esc(p.nombre)}</span>
        <span class="precio">${clp(p.precio)}</span>
        <span class="stock ${agotado ? 'sin-stock' : ''}">${agotado ? 'Agotado' : 'Stock: ' + p.stock}</span>
        <span class="stock">Código: ${esc(p.codigo)}</span>
      </div>
      ${boton}
    </div>`;
  }).join('');
}

// ---------- Carrito ----------
function guardarCarrito() {
  sessionStorage.setItem('prospin_carrito', JSON.stringify(carrito));
  const total = carrito.reduce((a, i) => a + i.cantidad, 0);
  document.getElementById('cantCarrito').textContent = total;
}

function agregar(id) {
  const p = productos.find(x => x.id === id);
  if (!p) return;
  const item = carrito.find(x => x.productoId === id);
  const actual = item ? item.cantidad : 0;
  if (actual >= p.stock) {
    mostrarAviso('avisoCatalogo', `Solo hay ${p.stock} unidades de ${p.nombre}.`, 'error');
    return;
  }
  if (actual >= 99) {
    mostrarAviso('avisoCatalogo', 'El máximo es 99 unidades por producto.', 'error');
    return;
  }
  if (item) item.cantidad++;
  else carrito.push({ productoId: id, cantidad: 1 });
  guardarCarrito();
  renderCarrito();
  mostrarAviso('avisoCatalogo', `${p.nombre} agregado al carrito.`, 'ok');
}

function quitar(id) {
  carrito = carrito.filter(x => x.productoId !== id);
  guardarCarrito();
  renderCarrito();
}

function renderCarrito() {
  guardarCarrito();
  const lista = document.getElementById('listaCarrito');
  const total = document.getElementById('totalCarrito');
  if (!carrito.length) {
    lista.innerHTML = '<p>Tu carrito está vacío.</p>';
    total.textContent = '';
    return;
  }
  let suma = 0;
  lista.innerHTML = carrito.map(i => {
    const p = productos.find(x => x.id === i.productoId);
    if (!p) return '';
    const sub = p.precio * i.cantidad;
    suma += sub;
    return `<div class="fila">
      <span>${esc(p.nombre)} × ${i.cantidad}</span>
      <span>${clp(sub)}</span>
      <button class="btn-linea" onclick="quitar(${p.id})">Quitar</button>
    </div>`;
  }).join('');
  total.textContent = 'Total: ' + clp(suma);
}

async function confirmarCompra() {
  if (!carrito.length) {
    mostrarAviso('avisoCarrito', 'Tu carrito está vacío.', 'error');
    return;
  }
  const items = carrito.map(i => ({ productoId: i.productoId, cantidad: i.cantidad }));
  try {
    const b = await apiFetch('/boletas', { method: 'POST', body: JSON.stringify({ items }) });
    carrito = [];
    guardarCarrito();
    mostrarAviso('avisoCarrito', `Compra realizada. Boleta N° ${b.id} por ${clp(b.total)}.`, 'ok');
    await cargarProductos();
  } catch (e) {
    mostrarAviso('avisoCarrito', e.message, 'error');
  }
}

// ---------- Mis compras (CLIENTE) ----------
async function cargarCompras() {
  try {
    const lista = await apiFetch('/boletas');
    document.getElementById('tablaCompras').innerHTML = lista.length
      ? lista.map(b => `<tr>
          <td>${b.id}</td>
          <td>${fecha(b.fecha)}</td>
          <td>${b.detalles.map(d => `${esc(d.producto.nombre)} × ${d.cantidad}`).join('<br>')}</td>
          <td>${clp(b.total)}</td>
        </tr>`).join('')
      : '<tr><td colspan="4">Aún no tienes compras.</td></tr>';
  } catch (e) {
    mostrarAviso('avisoCompras', e.message, 'error');
  }
}

// ---------- Órdenes (ADMIN y VENDEDOR) ----------
async function cargarOrdenes() {
  try {
    const lista = await apiFetch('/boletas');
    document.getElementById('tablaOrdenes').innerHTML = lista.length
      ? lista.map(b => `<tr style="cursor:pointer" onclick="verOrden(${b.id})">
          <td>${b.id}</td>
          <td>${fecha(b.fecha)}</td>
          <td>${esc(b.usuario.nombre)} (${esc(b.usuario.email)})</td>
          <td>${clp(b.total)}</td>
        </tr>`).join('')
      : '<tr><td colspan="4">No hay órdenes registradas.</td></tr>';
  } catch (e) {
    mostrarAviso('avisoOrdenes', e.message, 'error');
  }
}

async function verOrden(id) {
  try {
    const b = await apiFetch('/boletas/' + id);
    document.getElementById('detalleOrden').innerHTML = `
      <h3>Orden N° ${b.id}</h3>
      <p>Cliente: ${esc(b.usuario.nombre)} · ${esc(b.usuario.email)}</p>
      <table>
        <thead><tr><th>Código</th><th>Producto</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th></tr></thead>
        <tbody>
          ${b.detalles.map(d => `<tr>
            <td>${esc(d.producto.codigo)}</td>
            <td>${esc(d.producto.nombre)}</td>
            <td>${d.cantidad}</td>
            <td>${clp(d.precioUnitario)}</td>
            <td>${clp(d.subtotal)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p><strong>Total: ${clp(b.total)}</strong></p>`;
  } catch (e) {
    mostrarAviso('avisoOrdenes', e.message, 'error');
  }
}

function cerrarSesion() {
  clearSesion();
  sessionStorage.removeItem('prospin_carrito');
  location.replace('login.html');
}

if (sesion) init();
</script>
</body>
</html>
